  /chat/{id}/export:
    get:
      summary: Export chat
      description: |
        Exports a chat and all its messages as a ZIP file containing two files:
        - `chat.json`: Chat metadata (name, model, personality, timestamps)
        - `messages.jsonl`: All chat messages in JSON Lines format (one message per line)

        The export is streamed directly to the client for memory efficiency. The ZIP filename is based on the sanitized chat name.

        **Note**: If an error occurs during streaming, the ZIP file will be properly finalized but may be incomplete.
        The HTTP status code indicates whether the export was fully successful.
      tags: [Chat Management]
      parameters:
        - name: id
          in: path
          required: true
          description: Chat ID to export
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chat exported successfully
          content:
            application/zip:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: Attachment header with sanitized chat name as filename
              schema:
                type: string
                example: 'attachment; filename="My Chat.zip"'
            Cache-Control:
              description: Caching policy
              schema:
                type: string
                example: no-cache
        '400':
          description: Invalid chat ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Chat not found or user not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error during export. Note that if headers have already been sent, you may receive a valid but incomplete ZIP file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

