  # Personality Management Endpoints
  /personality:
    get:
      summary: List personalities
      description: Returns a paginated list of personalities for the current user, with optional filtering by name, content search, and date range
      tags: [Personality Management]
      parameters:
        - name: page
          in: query
          description: Page number (default 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page (default 10)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: name
          in: query
          description: Filter by personality name (case-insensitive)
          schema:
            type: string
        - name: query
          in: query
          description: Search in personality system prompt content (case-insensitive)
          schema:
            type: string
        - name: min_date
          in: query
          description: Filter personalities created after this date
          schema:
            type: string
            format: date-time
        - name: max_date
          in: query
          description: Filter personalities created before this date
          schema:
            type: string
            format: date-time
        - name: personality_ids
          in: query
          description: Optional comma-separated personality IDs to include in the list. Malformed UUIDs return 400.
          schema:
            type: string
            example: "123e4567-e89b-12d3-a456-426614174000,123e4567-e89b-12d3-a456-426614174001"
      responses:
        '200':
          description: Personalities retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Personality'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create personality
      description: Creates a new custom AI personality for the current user
      tags: [Personality Management]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the personality
                  maxLength: 255
                system_prompt:
                  type: string
                  description: System prompt that defines the personality behavior
                cover_image_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Optional gallery image ID used as the personality portrait cover. Send null to clear.
                accent_color:
                  type: string
                  nullable: true
                  pattern: '^#(?:[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$'
                  description: Optional hex accent color for this personality (for example #C2572A).
                thumbnail_circle:
                  $ref: '#/components/schemas/PersonalityThumbnailCircle'
              required:
                - name
                - system_prompt
              example:
                name: "Creative Writer"
                system_prompt: "You are a creative writing assistant that helps users craft compelling stories, poems, and other creative content. You provide inspiration, suggest plot ideas, help with character development, and offer constructive feedback on writing style and structure."
                cover_image_id: null
                accent_color: "#C2572A"
                thumbnail_circle:
                  cx: 0.5
                  cy: 0.42
                  r: 0.34
      responses:
        '201':
          description: Personality created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Personality'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

