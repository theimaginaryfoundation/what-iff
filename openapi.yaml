  # Chat Management Endpoints
  /chat/import:
    post:
      summary: Import an OpenAI or Anthropic conversations export
      description: |
        Accepts a multipart-uploaded `conversations.json` from either an OpenAI (ChatGPT) or an
        Anthropic (Claude) data export and hydrates each conversation as an archived Chat owned by the
        current user. The export format is detected automatically.

        **Asynchronous:** Because exports can be large, the upload is staged and the
        actual parse + persistence run as a background job. The endpoint responds `202 Accepted` with a
        Job; poll `GET /job/{id}` for status (`pending`/`processing`/`complete`/`failed`) and a JSON
        `progress` payload (`{phase, source, total, imported, skipped}`) to drive a progress UI.

        **Chunking:** Each upload is capped at ~60 MB. The web client splits larger `conversations.json`
        exports at conversation boundaries and uploads them sequentially.

        **Dedup:** Conversations are fingerprinted with `sha256(conversation_id|uuid)` using the export's
        own stable conversation ID. Re-importing the same file skips already-imported conversations.

        **Roles:** Only user/human and assistant messages are imported. System and tool messages are dropped.

        **Archive:** All imported threads are created in archived state (`archived=true`). Their
        `rehydration_state` is summarized lazily when the user restores (unarchives) the thread.

        **Error reporting:** Per-conversation parse and persistence failures are non-fatal and logged
        server-side; aggregate counts are reflected in the job's `progress`.
      tags: [Chat Management]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: conversations.json from an OpenAI or Anthropic data export (max 60 MB per upload)
      responses:
        '202':
          description: Import accepted and running in the background. Poll the returned Job for progress and status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Missing file, invalid multipart form, empty file, or unrecognized export format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File exceeds 60 MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /chat:
    get:
      summary: List chats
      description: |
        Returns a paginated list of chats for the current user, ordered by most recent activity.
        By default only **active** (non-archived) threads are returned. Pass `archived=true` to list archived threads only.
      tags: [Chat Management]
      parameters:
        - name: page
          in: query
          description: Page number (default 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page (default 10)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: name
          in: query
          description: Filter by chat name
          schema:
            type: string
        - name: search
          in: query
          description: Search in chat names and tags
          schema:
            type: string
        - name: tag
          in: query
          description: Filter by exact chat tag
          schema:
            type: string
        - name: personality_id
          in: query
          description: Filter by associated personality ID
          schema:
            type: string
            format: uuid
        - name: is_favorite
          in: query
          description: Filter by favorite status
          schema:
            type: boolean
        - name: archived
          in: query
          description: When true, return only archived threads. When false or omitted, return only active (non-archived) threads.
          schema:
            type: boolean
        - name: min_date
          in: query
          description: Filter chats created after this date
          schema:
            type: string
            format: date-time
        - name: max_date
          in: query
          description: Filter chats created before this date
          schema:
            type: string
            format: date-time
        - name: source
          in: query
          description: Filter to chats imported from this source (e.g. 'openai', 'anthropic'). Used by the post-import thread picker.
          schema:
            type: string
            enum: [openai, anthropic]
      responses:
        '200':
          description: Chats retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Chat'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create chat
      description: Creates a new chat session. Optional `personality_id` and `model_id` let callers start a thread with a specific persona/model in one round trip; both must be owned by the authenticated user (model must be active). When omitted, the user's default preferences are used.
      tags: [Chat Management]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the chat session
                  maxLength: 200
                last_message_time:
                  type: string
                  format: date-time
                  description: Timestamp of the most recent message (optional)
                personality_id:
                  type: string
                  format: uuid
                  description: Optional. Personality to associate with the new chat. Must be owned by the user.
                model_id:
                  type: string
                  format: uuid
                  description: Optional. Active model to associate with the new chat.
                tags:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    maxLength: 10
                  description: Optional chat tags (up to 10 tags, 10 chars each)
                is_favorite:
                  type: boolean
                  description: Whether the chat is marked as favorite
              required:
                - name
      responses:
        '201':
          description: Chat created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
