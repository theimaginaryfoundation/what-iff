        updated_at: "2024-01-01T00:00:00Z"

    # Memory Management Schemas
    Memory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        chat_id:
          type: string
          format: uuid
          description: ID of the chat this memory belongs to (optional for User-scoped memories)
        chat_name:
          type: string
          description: Name of the chat this memory belongs to (if applicable)
        content:
          type: string
          description: The memory content
        level:
          type: string
          enum: [global, personality, thread, summary]
          description: User-facing memory level
        type:
          type: string
          enum: [Context]
          description: Memory type classification
        starred:
          type: boolean
          description: Whether this memory is starred
        pinned_personality_id:
          type: string
          format: uuid
          nullable: true
          description: Personality this memory is pinned to, if any
        status:
          type: string
          enum: [active, inactive]
          description: Lifecycle status (inactive rows are retired merge sources)
        confidence:
          type: string
          enum: [low, medium, high]
        chain_metadata:
          type: object
          nullable: true
          properties:
            duplicate_count:
              type: integer
            verified_timestamps_first:
              type: array
              items:
                type: string
                format: date-time
            verified_timestamps_last:
              type: array
              items:
                type: string
                format: date-time
            merged_from_memory_ids:
              type: array
              items:
                type: string
                format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - content
        - level
        - type
        - starred
        - created_at
        - updated_at
      example:
        id: "123e4567-e89b-12d3-a456-426614174000"
        chat_id: "123e4567-e89b-12d3-a456-426614174001"
        chat_name: "Research Project Discussion"
        content: "User prefers detailed explanations with examples"
        level: "thread"
        type: "Context"
        starred: false
        created_at: "2024-01-01T00:00:00Z"
        updated_at: "2024-01-01T00:00:00Z"

    MemoryCreateRequest:
      type: object
      properties:
        content:
          type: string
        level:
          type: string
          enum: [global, personality, thread, summary]
        chat_id:
          type: string
          format: uuid
          nullable: true
        pinned_personality_id:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum: [Context]
          default: Context
        starred:
          type: boolean
          default: false
      required: [content, level]

    MemoryBatchCreateRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemoryCreateRequest'
        all_or_none:
          type: boolean
          default: false
      required: [items]

    MemoryBatchCreateResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        created_count:
          type: integer
      required: [results, created_count]

    MemoryPatchRequest:
      type: object
      properties:
        content:
          type: string
        level:
          type: string
          enum: [global, personality, thread, summary]
        chat_id:
          type: string
          format: uuid
          nullable: true
        pinned_personality_id:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum: [Context]
        starred:
          type: boolean
        status:
          type: string
          enum: [active, inactive]
        confidence:
          type: string
          enum: [low, medium, high]

    MemoryMergeEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        survivor_memory_id:
          type: string
          format: uuid
        merge_type:
          type: string
          enum: [create, fold_live, link]
          description: >
            create = new survivor row from a merge; fold_live = updated an existing live
            memory in place and retired absorbers; link = cross-referenced related-but-distinct
            memories under a shared link_group_id without deleting or de-indexing any rows.
        content:
          type: string
        duplicates_folded:
          type: integer
        link_group_id:
          type: string
          format: uuid
          nullable: true
        compaction_event_id:
          type: string
          format: uuid
          nullable: true
          description: The compaction (checkpoint) that produced this merge event, if any.
        source_members:
          type: array
          items:
            $ref: '#/components/schemas/MemoryMergeSourceMember'
        reverted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - survivor_memory_id
        - merge_type
        - content
        - duplicates_folded
        - created_at
        - updated_at

    MemoryMergeSourceMember:
      type: object
      properties:
        content:
          type: string
        scope:
          type: string
        confidence:
          type: string
          enum: [low, medium, high]
        memory_id:
          type: string
          format: uuid
          nullable: true
        is_new:
          type: boolean
      required:
        - content
        - scope
        - is_new

    CheckpointSnapshot:
      type: object
      description: >
        A content-addressed capture of a conversation summary or personality scratchpad. The same row
        is referenced as the "new" state of one compaction and the "old" state of the next.
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [summary, scratchpad]
        chat_id:
          type: string
          format: uuid
          nullable: true
          description: Set for summary snapshots.
        personality_id:
          type: string
          format: uuid
          nullable: true
          description: Set for scratchpad snapshots.
        content:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - kind
        - content
        - created_at

    CompactionLoadedMemory:
      type: object
      description: One memory that was live in the compacted conversation segment.
      properties:
        memory_id:
          type: string
          format: uuid
          nullable: true
        content:
          type: string
        scope:
          type: string
        confidence:
          type: number
          format: float
      required:
        - content
        - scope

    CompactionEvent:
      type: object
      description: >
        The audit record for one conversation checkpoint ("compaction"): before/after summary and
        scratchpad snapshots, the loaded-memory set, and every merge/link/create action produced.
      properties:
        id:
          type: string
          format: uuid
        chat_id:
          type: string
          format: uuid
        chat_name:
          type: string
          description: Current name of the conversation that produced the checkpoint.
        personality_id:
          type: string
          format: uuid
          nullable: true
        assistant_message_id:
          type: string
          format: uuid
          nullable: true
        provider:
          type: string
        reason:
          type: string
        old_summary:
          $ref: '#/components/schemas/CheckpointSnapshot'
        new_summary:
          $ref: '#/components/schemas/CheckpointSnapshot'
        old_scratchpad:
          $ref: '#/components/schemas/CheckpointSnapshot'
        new_scratchpad:
          $ref: '#/components/schemas/CheckpointSnapshot'
        loaded_memories:
          type: array
          items:
            $ref: '#/components/schemas/CompactionLoadedMemory'
        merge_events:
          type: array
          items:
            $ref: '#/components/schemas/MemoryMergeEvent'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - chat_id
        - created_at
        - updated_at

    # Billing & Subscription Schemas
    FreeTierQuotaStatus:
      type: object
      description: >-
        Free-trial credit status for a non-subscriber, derived from their
        tokens.core quota bucket. Values are credits, not messages (the legacy
        lifetime message counter was replaced by the trial credit bucket), so
        imported conversations no longer affect the allowance.
      properties:
        used:
          type: integer
          description: Trial credits already consumed (limit - remaining)
        limit:
          type: integer
          description: Trial credit allowance (0 means no trial bucket; hide the trial banner)
        remaining:
          type: integer
          description: Trial credits still available (max(0, limit - used))
        exceeded:
          type: boolean
          description: True when the trial allowance is used up (remaining == 0 and limit > 0)
      required:
        - used
        - limit
        - remaining
        - exceeded

    UsageEvent:
      type: object
      description: A single recorded usage event for a billable action
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        action_type:
          type: string
          enum: [chat_message, job_run, image_generation, web_search]
        model:
          type: string
          nullable: true
          description: LLM model name used for the action
        variant:
          type: string
          nullable: true
          description: Informational label (e.g. image quality)
        billed_tokens:
          type: integer
          format: int64
          nullable: true
          description: Token count used as the basis for slab billing when applicable
        slab_units:
          type: integer
          format: int64
          nullable: true
          description: Number of token slabs (multiplier) applied to base credits
        credits_charged:
          type: integer
          format: int64
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        created_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - action_type
        - credits_charged
        - created_at

    ActionSummary:
      type: object
      description: Aggregated usage for a single action type within a billing period
      properties:
        count:
          type: integer
          format: int64
        credits_charged:
          type: integer
          format: int64
      required:
        - count
        - credits_charged

    UsageSummary:
      type: object
      description: Usage summary for the current billing period
      properties:
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        has_quota:
          type: boolean
          description: When false, credits_total/credits_remaining are 0 and not meaningful — no quota bucket is configured for this user.
        credits_total:
          type: integer
          format: int64
        credits_used:
          type: integer
          format: int64
        credits_remaining:
          type: integer
          format: int64
        next_reset:
          type: string
          format: date-time
        by_action_type:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ActionSummary'
        recent_events:
          type: array
          items:
            $ref: '#/components/schemas/UsageEvent'
      required:
        - period_start
        - period_end
        - has_quota
        - credits_total
        - credits_used
        - credits_remaining
        - next_reset
        - by_action_type
        - recent_events

    StripeConfig:
      type: object
      properties:
        publishable_key:
          type: string
          description: Stripe publishable key
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PlanConfig'
          description: Configured subscription tiers (Stripe price IDs and credit allotments)
        trial_period_days:
          type: integer
          format: int64
          description: Trial period in days
        free_trial_credits:
          type: integer
          format: int64
          description: One-time free-trial credit allowance granted to new users (0 = no trial)
      required:
        - publishable_key

    PlanConfig:
      type: object
      properties:
        id:
          type: string
          description: Internal tier id (e.g. casual, regular, power, standard)
        name:
          type: string
        price_id:
          type: string
          description: Stripe Price ID
        monthly_credits:
          type: integer
          format: int64
        rank:
          type: integer
          description: Tier ordering for upgrade-only rules (higher is more expensive)
        legacy:
          type: boolean
          description: When true, tier is hidden from new subscribers unless they are already on it
        amount:
          type: integer
          format: int64
          description: Price amount in cents (from Stripe)
        currency:
          type: string
        interval:
          type: string
      required:
        - id
        - name
        - price_id
        - monthly_credits
        - rank

    UpdateMaxMonthlySpendRequest:
      type: object
      description: >
        At least one of max_monthly_spend_usd or usage_based_billing_enabled must be provided.
        When usage_based_billing_enabled is false, max_monthly_spend_usd may be omitted so the stored cap is unchanged.
        When usage-based billing is enabled (after the request), the effective monthly cap must be at least 1 USD
        and at least the whole-dollar monthly price of the user's current plan; include max_monthly_spend_usd in
        the same request if enabling usage-based billing while the stored cap is still zero.
      properties:
        max_monthly_spend_usd:
          type: integer
          minimum: 0
          maximum: 1000
          description: >
            Whole-dollar cap on overage spending per billing period (0–1000).
            Applies when usage-based billing is enabled (1000 credits = $1.00 metered overage).
        usage_based_billing_enabled:
          type: boolean
          description: >
            When true, metered overage is allowed subject to max_monthly_spend_usd and plan rules.
            Enabling requires a positive effective cap (send max_monthly_spend_usd if the stored value is zero).

    UpdateMaxMonthlySpendResponse:
      type: object
      properties:
        max_monthly_spend_usd:
          type: integer
        usage_based_billing_enabled:
          type: boolean
        message:
          type: string
      required:
        - max_monthly_spend_usd
        - usage_based_billing_enabled
        - message

    CouponInfo:
      type: object
      properties:
        id:
          type: string
          description: Coupon ID (also used as the coupon code)
          example: "SUMMER20"
        name:
          type: string
          description: Human-readable name of the coupon
          example: "Summer Sale"
        percent_off:
          type: number
          format: float
          description: Percentage discount (e.g., 20.0 for 20% off)
          example: 20.0
        amount_off:
          type: integer
          description: Fixed amount discount in cents (e.g., 500 for $5 off)
          example: 500
        currency:
          type: string
          description: Currency code (only present for amount_off coupons)
          example: "usd"
        duration_in_months:
          type: integer
          description: Duration in months (1 = once, 9999 = forever, N = repeating for N months)
          example: 1
        valid:
          type: boolean
          description: Whether the coupon is currently valid
          example: true
      required:
        - id
        - duration_in_months
        - valid

    PaginatedResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
        total_count:
          type: integer
        page:
          type: integer
      example:
        results: []
        total_count: 25
        page: 1

    Error:
      type: object
      properties:
        error:
          type: string
          deprecated: true
          description: |
            DEPRECATED — always identical to `message`. Retained only so existing clients
            keep working; read `message` and `code` instead. Removed once nothing reads
            it (ADR 0x020). Never contains internal error detail.
        message:
          type: string
          description: Human-readable explanation, safe to display to an end user
        code:
          $ref: '#/components/schemas/ErrorCode'
        details:
          description: Optional structured metadata for clients
          nullable: true
      required:
        - code
      example:
        error: "Personality name is required"
        message: "Personality name is required"
        code: "bad_request"
        details: null

    ErrorCode:
      type: string
      description: |
        Stable machine-readable error identifier. Always present on an error response.

        Codes come in two tiers (ADR 0x020):

        - **Specific** codes name a single failure condition and are a contract. Once
          published they are not renamed or repurposed, so clients may branch on them.
        - **Generic** codes are derived from the HTTP status and are the default for
          endpoints that have not been assigned a specific one yet. They are **not**
          stable branch targets: an endpoint may narrow from `bad_request` to a
          specific code at any time, and that is not a breaking change. Do not branch
          on a generic code — use the HTTP status instead.
      enum:
        # Generic — derived from HTTP status. Do not branch on these.
        - bad_request
        - unauthorized
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - payload_too_large
        - unprocessable_entity
        - too_many_requests
        - internal_error
        - bad_gateway
        - service_unavailable
        - gateway_timeout
        - client_error
        - server_error
        # Specific — stable contracts, safe to branch on.
        - message_too_long
        - quota_exceeded
        - system_prompt_too_long

    # Cross-resource search schemas (GET /search)
    SearchResult:
      type: object
      description: A single hit inside a search section.
      properties:
        id:
          type: string
          format: uuid
          description: Resource identifier in its source datastore.
        label:
          type: string
          description: Primary line shown in the palette row (resource title).
        description:
          type: string
          description: Short subtitle line (resource type, scope, etc.). Optional.
        route:
          type: string
          description: SPA route the client should navigate to when the user activates this row.
          example: "/personality/4b8c1f02-2e1e-4b4f-9f64-9d1f1e3d8a9c"
        icon_type:
          type: string
          description: Icon hint mirroring the section type in v1; reserved for future per-result variation.
          enum: [chat, personality, ritual, memory, image]
        score:
          type: integer
          description: Relevance score; higher is more relevant. Stable tiers (40/60/80/100) so clients can group by quality if needed.
        snippet:
          type: string
          description: Optional preview text trimmed to ~140 runes.
      required:
        - id
        - label
        - route
        - icon_type
        - score

    SearchSection:
      type: object
      description: One resource-type section of the search response. Always emitted (with empty `results`) so clients render predictable headers.
      properties:
        type:
          type: string
          enum: [chat, personality, ritual, memory, image]
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
      required:
        - type
        - results

    SearchResponse:
      type: object
      description: Body of GET /search. Sections are returned in canonical order (chat, personality, ritual, memory, image).
      properties:
        query:
          type: string
          description: Echoed and trimmed query string for client display.
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SearchSection'
      required:
        - query
        - sections

