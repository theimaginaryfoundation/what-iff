              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Patch memory
      description: Updates mutable memory fields for the authenticated user
      tags: [Memory Management]
      parameters:
        - name: id
          in: path
          required: true
          description: Memory ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryPatchRequest'
      responses:
        '200':
          description: Memory updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Memory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /memory/export:
    get:
      summary: Export all memories
      description: |
        Exports all memories for the authenticated user as a ZIP archive.
        The archive contains one JSONL file per memory category:
        - `chat.json`: chat-scoped memories
        - `user.json`: user-scoped unpinned memories
        - `personality-{uuid}.json`: one file per personality with pinned memories

        Each file contains one JSON object per line (JSONL format). Records are
        ordered by `created_at` ascending within each file.
      tags: [Memory Management]
      responses:
        '200':
          description: Memories exported successfully
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error (response may be partial if headers were already sent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /account/export:
    post:
      summary: Enqueue a full-account export
      description: |
        Enqueues an asynchronous full-account export for the authenticated user, built in-process. The
        export is a **ZIP** containing conversations (in the round-trippable Claude `conversations.json`
        shape), personalities (with scratchpads), memories (as a nested `memories.zip`), a
        `files/manifest.json` inventory of the user's uploaded files, and a `manifest.json`.

        Returns `202` with a Job; poll `GET /account/export/{id}` for the phase. **The download link is
        delivered only by email — never in the API response.** This is a deliberate security control:
        access to the app account alone cannot exfiltrate the full account, since the download also
        requires access to the user's mailbox.

        Rate limited to one export per user per 10 minutes.
      tags: [Account Export]
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Export enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: An export was requested too recently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /account/export/{id}:
    get:
      summary: Get account export status
      description: |
        Returns the export Job. Its `progress` field is a JSON-encoded `AccountExportProgress`
        (`phase` of queued/building/uploading/complete/failed, section `counts`, and a user-safe
        `message`). It never contains the download link — that is emailed.
      tags: [Account Export]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Export job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Export not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /account/import:
    post:
      summary: Enqueue an account export ZIP import
      description: |
        Restores conversations, memories, and personalities from an export ZIP (produced by
        `/account/export`). Additive and id-stripped: conversations dedupe by import hash,
        personalities dedupe by name, and everything is created fresh under the importing user, so an
        export loads into any account without key collisions. Whatiff metadata in `conversations.json`
        preserves checkpoint context and personality associations; source chat/personality references are
        remapped before memories import. Summarized threads are immediately resumable, while threads
        without a summary remain archived for lazy rehydration. The upload is staged to a temporary
        file, then restored by a bounded in-process worker. Returns `202` with a Job; poll
        `GET /account/import/{id}` until terminal status. Its JSON-encoded `progress` contains phase,
        section counts, warnings, and the final result. Memory import requires the server to have an
        OpenAI key (embeddings are regenerated); when unavailable, memories are skipped.
      tags: [Account Export]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The export ZIP.
      responses:
        '202':
          description: Import enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Missing or invalid ZIP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Import file too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /account/import/{id}:
    get:
      summary: Get account import status and results
      description: |
        Returns the account-import Job. Parse its JSON-encoded `progress` as `AccountImportProgress`;
        terminal successful jobs include the per-section result and warnings.
      tags: [Account Export]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account import job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Import not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /memory/import:
    post:
      summary: Import memories from export
      description: |
        Imports memories from a ZIP archive produced by `/memory/export`.
        Dedupe is performed by memory UUID (`id`), so re-importing the same export
        will skip already imported records.
      tags: [Memory Management]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported_count:
                    type: integer
                  duplicate_count:
                    type: integer
                  invalid_record_count:
                    type: integer
                  invalid_reasons:
                    type: object
                    properties:
                      malformed_json:
                        type: integer
                      missing_id:
                        type: integer
                      empty_content:
                        type: integer
                      missing_created_at:
                        type: integer
                      missing_chat_id:
                        type: integer
                  skipped_missing_chat_count:
                    type: integer
                  skipped_missing_personality_count:
                    type: integer
        '400':
          description: Invalid import file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

