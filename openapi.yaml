openapi: 3.0.3
info:
  title: Personal Assistant API
  version: 1.0.0
  description: |
    A RESTful API for a personal assistant AI agent that helps with research, content creation,
    and other tasks. The API provides user management, chat functionality, and background job processing.

    ## Authentication
    Most endpoints require authentication using JWT Bearer tokens obtained from the login endpoint.

    ## Rate Limiting
    API requests may be rate-limited to ensure fair usage.

  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:8080/api
    description: Development server
  - url: https://api.example.com/api
    description: Production server

security:
  - bearerAuth: []

paths:
  # Health Check
  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the API
      tags: [System]
      security: []
      responses:
        '200':
          description: API is running
          content:
            text/plain:
              schema:
                type: string
                example: "API is running"

  # Build provenance
  /version:
    get:
      summary: Build version endpoint
      description: >
        Returns the build provenance stamped into the running binary at compile
        time. Unauthenticated so deployment tooling can verify what is running
        before logging in. A binary built without -ldflags stamping reports
        "dev"/"unknown".
      tags: [System]
      security: []
      responses:
        '200':
          description: Build provenance of the running binary
          content:
            application/json:
              schema:
                type: object
                required: [version, commit, built_at]
                properties:
                  version:
                    type: string
                    description: Human-facing release identifier (a tag, or "dev")
                    example: "v1.2.3"
                  commit:
                    type: string
                    description: Git SHA of the source tree the binary was built from
                    example: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b"
                  built_at:
                    type: string
                    description: UTC build timestamp, RFC 3339
                    example: "2026-08-21T00:00:00Z"
                  overlay_commit:
                    type: string
                    description: >
                      Only present in builds that compose additional source on
                      top of the open-source tree; absent means no overlay.
                    example: "9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a"

  # Authentication Endpoints
  /user/register:
    post:
      summary: Register a new user
      description: Creates a new user account and returns authentication tokens
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
      responses:
        '201':
          description: User successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/login:
    post:
      summary: User login
      description: Authenticates a user and returns access and refresh tokens
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/refresh:
    post:
      summary: Refresh access token
      description: Refreshes an access token using a valid refresh token
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refresh successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # User Management Endpoints
  /user/profile:
    get:
      summary: Get user profile
      description: Returns the current user's profile information
      tags: [User Management]
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update user profile
      description: Updates the current user's profile information
      tags: [User Management]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/password:
    put:
      summary: Update user password
      description: Updates the current user's password
      tags: [User Management]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password updated successfully"
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized or incorrect current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/delete:
    delete:
      summary: Delete user account
      description: Permanently deletes the current user's account
      tags: [User Management]
      responses:
        '200':
          description: User account deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User account deleted successfully"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/usage:
    get:
      summary: Get user usage statistics
      description: Returns usage statistics for the current user including chat counts, message counts, and token usage
      tags: [User Management]
      parameters:
        - name: period
          in: query
          description: Time period for usage statistics
          schema:
            type: string
            enum: [day, week, month]
            default: month
          example: month
        - name: start_date
          in: query
          description: Custom start date for usage statistics (ISO 8601 format). Overrides period parameter if provided.
          schema:
            type: string
            format: date-time
          example: "2024-01-01T00:00:00Z"
        - name: end_date
          in: query
          description: Custom end date for usage statistics (ISO 8601 format). Used with start_date parameter.
          schema:
            type: string
            format: date-time
          example: "2024-01-31T23:59:59Z"
      responses:
        '200':
          description: Usage statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageStats'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/preferences:
    get:
      summary: Get user preferences
      description: Returns the current user's preferences including default model settings
      tags: [User Management]
      responses:
        '200':
          description: User preferences retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update user preferences
      description: Updates the current user's preferences
      tags: [User Management]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferencesUpdateRequest'
      responses:
        '200':
          description: User preferences updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhook-tokens:
    get:
      summary: List webhook API tokens
      description: Returns webhook API token metadata for the authenticated user.
      tags: [Webhook Tokens]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Webhook tokens retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookToken'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create webhook API token
      description: Creates a new webhook API token for the authenticated user and returns the raw token once.
      tags: [Webhook Tokens]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookTokenRequest'
      responses:
        '201':
          description: Webhook token created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWebhookTokenResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhook-tokens/{id}:
    delete:
      summary: Revoke webhook API token
      description: Revokes an existing webhook API token for the authenticated user.
      tags: [Webhook Tokens]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Webhook token ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Webhook token revoked successfully
        '400':
          description: Invalid token ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Webhook token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Role Management Endpoints
  /v1/roles:
    get:
      summary: List all roles (Admin)
      description: |
        Retrieves a paginated list of all roles in the system.
        Requires admin or super_admin role.
      tags: [Admin]
      parameters:
        - name: page
          in: query
          description: Page number (starts at 1)
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          description: Search query to filter roles by name or description
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Roles retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create a new role (Admin)
      description: |
        Creates a new role in the system.
        Requires admin or super_admin role.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Role name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/roles/{id}:
    get:
      summary: Get role by ID (Admin)
      description: |
        Retrieves detailed information about a specific role.
        Requires admin or super_admin role.
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          description: Role ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Invalid role ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update role (Admin)
      description: |
        Updates an existing role in the system.
        Requires admin or super_admin role.
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          description: Role ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Role name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete role (Admin)
      description: |
        Deletes a role from the system.
        Requires admin or super_admin role.
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          description: Role ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Role deleted successfully
        '400':
          description: Invalid role ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Billing & Subscription Endpoints
  /billing/config:
    get:
      summary: Get billing configuration
      description: Returns Stripe publishable key and plan configuration for the frontend (public endpoint)
      tags: [Billing]
      responses:
        '200':
          description: Billing configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeConfig'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /billing/max-spend:
    put:
      summary: Update monthly max spend cap
      description: Sets the user's whole-dollar monthly maximum for automatic credit top-ups (Phase 1 stores only; charging not yet implemented).
      tags: [Billing]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaxMonthlySpendRequest'
      responses:
        '200':
          description: Max spend updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMaxMonthlySpendResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /billing/quota-status:
    get:
      summary: Get free-trial credit status
      description: >-
        Returns the authenticated user's free-trial credit status, derived from
        their tokens.core quota bucket (credits, not messages). If the user has an
        active subscription, all values are zero (the trial does not apply).
      tags: [Billing]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Quota status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeTierQuotaStatus'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to retrieve quota status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /billing/usage:
    get:
      summary: Get usage summary for current billing period
      description: Returns credit usage summary, breakdown by action type, and recent usage events for the authenticated user's current billing period.
      tags: [Billing]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usage summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to retrieve usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /billing/coupon/validate:
    post:
      summary: Validate a coupon code
      description: Validates a Stripe coupon code and returns coupon details if valid
      tags: [Billing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                coupon_code:
                  type: string
                  description: The coupon code to validate
                  example: "SUMMER20"
              required:
                - coupon_code
      responses:
        '200':
          description: Coupon validated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponInfo'
        '400':
          description: Bad request - invalid coupon or empty code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Coupon not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Stripe service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Model Management Endpoints
  /model:
    get:
      summary: List available models
      description: Returns a list of active AI models that users can select from
      tags: [Model Management]
      responses:
        '200':
          description: Models retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Job Management Endpoints
  /job:
    get:
      summary: List jobs
      description: Returns a paginated list of jobs for the current user
      tags: [Job Management]
      parameters:
        - name: page
          in: query
          description: Page number (default 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page (default 10)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: job_type
          in: query
          description: Filter by job type
          schema:
            type: string
        - name: status
          in: query
          description: Filter by job status
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: reference
          in: query
          description: Filter by reference
          schema:
            type: string
      responses:
        '200':
          description: Jobs retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Job'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /job/{id}:
    get:
      summary: Get job by ID
      description: Returns a specific job by its ID
      tags: [Job Management]
      parameters:
        - name: id
          in: path
          required: true
          description: Job ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /job/{id}/status:
    put:
      summary: Update job status
