      summary: List memory merge events
      description: >
        Returns paginated dedupe/merge log entries for the authenticated user.
      tags: [Memory Management]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Merge events retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/MemoryMergeEvent'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Experimental memory dedupe chain is not enabled for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /memory/merge-events/{id}/undo:
    post:
      summary: Undo a memory merge event
      description: >
        Reverts one merge log entry (restores prior chain metadata or deletes a created survivor).
      tags: [Memory Management]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Merge event reverted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryMergeEvent'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Merge event/survivor not found, or experimental memory dedupe chain is not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Merge event already reverted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /memory/compaction-events:
    get:
      summary: List compaction (checkpoint) audit events
      description: >
        Returns paginated compaction events, newest first. Each captures a conversation checkpoint:
        the before/after conversation summary and personality scratchpad (as content-addressed
        snapshots), the memories loaded into the segment, and every merge/link/create action produced.
      tags: [Memory Management]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Compaction events retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/CompactionEvent'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Experimental memory dedupe chain is not enabled for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /memory/compaction-events/{id}:
    get:
      summary: Get one compaction event
      description: >
        Returns a single compaction event with all snapshots and nested merge events resolved.
      tags: [Memory Management]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Compaction event retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompactionEvent'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Compaction event not found, or experimental memory dedupe chain is not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /memory/snapshots/{id}/revert:
    post:
      summary: Revert a checkpoint snapshot
      description: >
        Restores a summary or scratchpad snapshot to its live source. Summary snapshots overwrite the
        chat's checkpoint summary; scratchpad snapshots overwrite the personality's scratchpad (shared
        across that personality's chats). Snapshot rows are never mutated or deleted.
      tags: [Memory Management]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Snapshot reverted; the restored snapshot is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointSnapshot'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Snapshot/chat/personality not found, or experimental memory dedupe chain is not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Snapshot cannot be reverted (missing owner reference)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /memory/batch:
    post:
      summary: Create memories in batch
      description: Creates multiple memories for the authenticated user
      tags: [Memory Management]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryBatchCreateRequest'
      responses:
