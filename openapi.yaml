  /personality/{id}/expressions/generate-default-grid:
    post:
      summary: Generate default expression portraits (3×3 grid)
      description: >-
        Primary integration: personality expressions UI (“Generate defaults” / “Regenerate” with
        `force=true`). Runs a nano likeness pass from the system prompt, one medium-quality square
        **3×3** image, splices nine panels, uploads each, and upserts the default expression keys.
        Not quota-metered (~$0.01 per run). If all default keys already have images, the handler
        returns 200 with the current list and header `X-Expression-Grid: unchanged` unless
        `force=true`. Safe to retry: later runs upsert the same keys; mid-run failures can leave a
        partial grid. Other auto-triggers (create/accept) are intentionally not used — call this
        endpoint explicitly.
      tags: [Personality Management]
      parameters:
        - name: id
          in: path
          required: true
          description: Personality ID
          schema:
            type: string
            format: uuid
        - name: force
          in: query
          required: false
          description: When true, regenerate even if all default expression slots already have images
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Expressions after grid generation (full list for this personality)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonalityExpression'
        '400':
          description: Invalid personality ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Personality not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Generation or storage failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

