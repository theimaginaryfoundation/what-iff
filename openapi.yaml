  # Memory Management Endpoints
  /memory:
    get:
      summary: List memories
      description: Returns a paginated list of memories for the current user, with optional filtering by chat, level, content, starred state, and date range
      tags: [Memory Management]
      parameters:
        - name: page
          in: query
          description: Page number (default 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page (default 10)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: chat_id
          in: query
          description: Filter by specific chat ID
          schema:
            type: string
            format: uuid
        - name: level
          in: query
          description: Filter by memory level
          schema:
            type: string
            enum: [global, personality, thread, summary]
        - name: type
          in: query
          description: Filter by memory type
          schema:
            type: string
            enum: [Context]
        - name: starred
          in: query
          description: Filter by starred state
          schema:
            type: boolean
        - name: pinned_personality_id
          in: query
          description: Filter by pinned personality ID
          schema:
            type: string
            format: uuid
        - name: query
          in: query
          description: Search in memory content (case-insensitive)
          schema:
            type: string
        - name: min_date
          in: query
          description: Filter memories created after this date
          schema:
            type: string
            format: date-time
        - name: max_date
          in: query
          description: Filter memories created before this date
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          description: Sort order
          schema:
            type: string
            enum: [created_desc, created_asc, updated_desc]
        - name: status
          in: query
          description: Filter by lifecycle status
          schema:
            type: string
            enum: [active, inactive]
      responses:
        '200':
          description: Memories retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Memory'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create memory
      description: Creates one memory for the authenticated user
      tags: [Memory Management]
