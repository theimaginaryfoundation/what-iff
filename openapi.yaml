      description: Updates an existing personality
      tags: [Personality Management]
      parameters:
        - name: id
          in: path
          required: true
          description: Personality ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the personality
                  maxLength: 255
                system_prompt:
                  type: string
                  description: System prompt that defines the personality behavior
                cover_image_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Optional gallery image ID used as the personality portrait cover. Send null to clear.
                accent_color:
                  type: string
                  nullable: true
                  pattern: '^#(?:[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$'
                  description: Optional hex accent color for this personality (for example #C2572A).
                thumbnail_circle:
                  $ref: '#/components/schemas/PersonalityThumbnailCircle'
              required:
                - name
                - system_prompt
              example:
                name: "Creative Writer Pro"
                system_prompt: "You are an advanced creative writing assistant with expertise in multiple genres. You help users develop complex narratives, create compelling characters, and master various writing techniques including dialogue, pacing, and literary devices."
                cover_image_id: null
                accent_color: "#C2572A"
                thumbnail_circle:
                  cx: 0.5
                  cy: 0.42
                  r: 0.34
      responses:
        '200':
          description: Personality updated successfully
