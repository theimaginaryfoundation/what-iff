  /chat/{chatId}/file-attachment:
    post:
      summary: Upload file attachment to chat
      description: |
        Uploads a file attachment to a specific chat. The file is processed and stored,
        and can be referenced in subsequent chat messages.

        **Supported file types**: .c, .cpp, .cs, .css, .csv, .doc, .docx, .gif, .go, .html, .java, .jpeg, .jpg, .js, .json, .md, .pdf, .php, .png, .pptx, .py, .rb, .sh, .tar, .tex, .tgz, .ts, .txt, .xlsx, .xml, .zip

        **Maximum file size**: 30 MB
      tags: [File Attachments]
      parameters:
        - name: chatId
          in: path
          required: true
          description: Chat ID to attach the file to
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                attachment:
                  type: string
                  format: binary
                  description: The file to upload
              required:
                - attachment
      responses:
        '201':
          description: File attachment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAttachment'
        '400':
          description: Invalid request data, unsupported file type, or a file over the 30 MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error during file upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

