services:
  local-files-init:
    image: busybox:1.36
    command: sh -c "mkdir -p /tmp/chat-app-files && chown -R 65532:0 /tmp/chat-app-files && chmod -R 775 /tmp/chat-app-files"
    volumes:
      - local-files:/tmp/chat-app-files
    restart: "no"

  api:
    build:
      context: .
    # Optional so db-only bring-up (make db-up, scripts/mock-e2e.sh, CI) works
    # on a fresh clone before `cp .env.example .env`.
    env_file:
      - path: .env
        required: false
    environment:
      # Use CHATAPP_* variable names to avoid accidental overrides from shell env
      # used by native (non-docker) development.
      SERVER_HOST: ${CHATAPP_SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${CHATAPP_SERVER_PORT:-8080}
      DB_TYPE: ${CHATAPP_DB_TYPE:-postgres}
      DB_HOST: ${CHATAPP_DB_HOST:-db}
      DB_PORT: ${CHATAPP_DB_PORT:-5432}
      DB_USER: ${CHATAPP_DB_USER:-chatapp}
      DB_PASSWORD: ${CHATAPP_DB_PASSWORD:-chatapp}
      DB_NAME: ${CHATAPP_DB_NAME:-chatapp}
      # This compose stack's Postgres has no TLS listener — explicit opt-out,
      # not the app's default (which is "require"; see internal/database/db.go).
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      # Defaults to false: a real deployment pointed at a real database must
      # opt in explicitly. Set to true in your own .env for fast local schema
      # cleanup during iterative development (still gated on ENV being one of
      # development/test/local — see IsExplicitLocalEnv).
      DESTRUCTIVE_MIGRATION: ${DESTRUCTIVE_MIGRATION:-false}
      # No fallback value for anything below this line: a shipped default
      # would be public the moment this repo is public, so compose leaves
      # these unset unless your shell or .env provides them. The server
      # validates JWT_SECRET/JWT_REFRESH_SECRET/TOKEN_ENCRYPTION_SECRET at
      # boot and refuses to start on a missing, short, or known-placeholder
      # value — see internal/auth.ValidateSecret and
      # datastore.ValidateTokenEncryptionSecret.
      OPENAI_API_KEY:
      ANTHROPIC_API_KEY:
      JWT_SECRET:
      JWT_REFRESH_SECRET:
      TOKEN_ENCRYPTION_SECRET:
      BCRYPT_COST: ${BCRYPT_COST:-12}
      # No fallback here either: compose supplying "development" would
      # silently satisfy IsExplicitLocalEnv()'s explicit-ENV gate for anyone
      # who never configured anything. Set it in your .env (as .env.example
      # already does) or export it in your shell.
      ENV:
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      # S3 file archiving — leave empty to use the local dev file store.
      S3_FILE_BUCKET: ${S3_FILE_BUCKET:-}
      # Cognito is optional for local development. Leave blank to use local JWT auth only.
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # Billing feature flag - set to "true" to enable Stripe integration
      REQUIRE_BILLING: ${REQUIRE_BILLING:-false}
      # Stripe configuration (only used when REQUIRE_BILLING=true)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PLAN_PRICE_ID: ${PLAN_PRICE_ID:-}
      PLAN_PRICE_ID_CASUAL: ${PLAN_PRICE_ID_CASUAL:-}
      PLAN_PRICE_ID_REGULAR: ${PLAN_PRICE_ID_REGULAR:-}
      PLAN_PRICE_ID_POWER: ${PLAN_PRICE_ID_POWER:-}
      STRIPE_OVERAGE_PRICE_ID: ${STRIPE_OVERAGE_PRICE_ID:-}
      STRIPE_METER_NAME: ${STRIPE_METER_NAME:-}
      # New users receive a one-time free-trial credit allowance (tokens.core quota
      # bucket, see datastore.TrialCoreCredits). No env var configures the free tier;
      # the legacy FREE_TIER_MESSAGE_LIMIT message counter has been removed.
      # Enable AgentJobsScheduler
      ENABLE_AGENTJOBS_SCHEDULER: ${ENABLE_AGENTJOBS_SCHEDULER:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:8082,http://localhost:4200,http://localhost:4201}
    depends_on:
      local-files-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - "${CHATAPP_API_PORT:-8080}:8080"
    volumes:
      # Persist local file store across container rebuilds (no-op when S3_FILE_BUCKET is set).
      - local-files:/tmp/chat-app-files

  web:
    build:
      context: ./web/app
      args:
        API_URL: ${PERSONAL_ASSISTANT_API_URL:-http://localhost:8080/api}
        AUTH_MODE: ${PERSONAL_ASSISTANT_AUTH_MODE:-local}
        ENABLE_GALLERY_EXPRESSION_ASSIGNMENT: ${PERSONAL_ASSISTANT_ENABLE_GALLERY_EXPRESSION_ASSIGNMENT:-false}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${PERSONAL_ASSISTANT_PORT:-8081}:80"

  # ── Database ──────────────────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${CHATAPP_DB_USER:-chatapp}
      POSTGRES_PASSWORD: ${CHATAPP_DB_PASSWORD:-chatapp}
      POSTGRES_DB: ${CHATAPP_DB_NAME:-chatapp}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${CHATAPP_DB_USER:-chatapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${CHATAPP_DB_EXPOSED_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  db-data:
  local-files:
