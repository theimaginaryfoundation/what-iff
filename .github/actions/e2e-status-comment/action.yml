name: 'Post E2E status comment section'
description: >-
  Merges one E2E workflow's results into a sticky PR comment, as a section
  keyed by a stable id. Workflows that share a comment-key land as separate
  sections of one comment; a workflow with its own comment-key (e.g. the
  opt-in local-LLM run, which triggers on a different cadence) gets its own
  sticky comment that updates independently.
inputs:
  pr:
    description: 'Pull request number to comment on'
    required: true
  comment-key:
    description: >-
      Identity of the sticky comment this section belongs to. Sections
      sharing a key merge into one comment; a distinct key gets its own.
    required: false
    default: 'e2e-status-comment'
  section:
    description: "Stable id for this workflow's section, e.g. mock, local-llm"
    required: true
  order:
    description: "Sort key controlling this section's position in the comment (lower first)"
    required: true
  body-file:
    description: "Path to a markdown file containing just this section's content"
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ inputs.pr }}
        COMMENT_KEY: ${{ inputs.comment-key }}
        SECTION: ${{ inputs.section }}
        ORDER: ${{ inputs.order }}
        BODY_FILE: ${{ inputs.body-file }}
      # $GITHUB_WORKSPACE, not ${{ github.action_path }}. This action is used by
      # jobs that run inside a container (e2e-local-llm.yml), where the two do
      # not agree: the workspace is mounted under /__w, but
      # `github.action_path` still reports the runner's *host* checkout path,
      # so the script is simply not there and the step dies with "can't open
      # file". The nightly never caught it because this step only runs on
      # pull_request, and the opt-in local-LLM job only runs on a PR carrying
      # the `run-local-model` label.
      #
      # This action is repo-local, so the checkout that any caller must already
      # have done puts it at a known place under the workspace, which resolves
      # correctly both in a container and on a bare runner.
      run: python3 "$GITHUB_WORKSPACE/.github/actions/e2e-status-comment/merge_comment.py"
