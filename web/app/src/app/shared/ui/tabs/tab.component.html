<button class="ui-tab" [class.ui-tab--sm]="tabs.size() === 'sm'" type="button" role="tab" [id]="id()" [attr.aria-controls]="controls()" [attr.aria-selected]="isSelected()" [tabIndex]="isSelected() ? 0 : -1" [disabled]="disabled()" (click)="activate()" (keydown)="onKeydown($event)">
  <ng-content />
</button>
