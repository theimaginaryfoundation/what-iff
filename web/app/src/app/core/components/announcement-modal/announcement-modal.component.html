@if (announcementService.isOpen() && announcementService.currentAnnouncement(); as announcement) {
  <ui-modal
    [open]="announcementService.isOpen()"
    labelledBy="announcement-modal-title"
    size="lg"
    (dismiss)="dismiss()">

      <!-- Gradient header band -->
      <div class="h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>

      <!-- Header -->
      <div modal-header class="flex items-start justify-between">
        <div class="flex items-center gap-3">
          <!-- Sparkle icon -->
          <div class="flex-shrink-0 flex items-center justify-center h-10 w-10 rounded-full bg-indigo-100 dark:bg-indigo-900">
            <svg class="h-5 w-5 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
            </svg>
          </div>
          <div>
            <p class="text-xs font-semibold uppercase tracking-widest text-indigo-600 dark:text-indigo-400 mb-0.5">
              What&rsquo;s New
            </p>
            <h3 id="announcement-modal-title"
                class="text-lg font-bold text-gray-900 dark:text-white leading-tight">
              {{ announcement.title }}
            </h3>
          </div>
        </div>
      </div>

      <!-- Body -->
      <div>
        <div class="text-sm text-gray-600 dark:text-gray-300 leading-relaxed
                    [&_p]:mb-2 [&_p:last-child]:mb-0
                    [&_ul]:list-disc [&_ul]:pl-5 [&_ul]:mb-2
                    [&_li]:mb-1">
          <markdown [data]="announcement.body"></markdown>
        </div>
      </div>

      <!-- Footer -->
      <div modal-footer class="flex items-center justify-end gap-3">
        <button (click)="dismiss()"
                type="button"
                class="text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition-colors px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
          Got it
        </button>
        @if (announcement.ctaText) {
          <button (click)="onCta()"
                  type="button"
                  class="text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 px-5 py-2 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800">
            {{ announcement.ctaText }}
          </button>
        }
      </div>

  </ui-modal>
}
