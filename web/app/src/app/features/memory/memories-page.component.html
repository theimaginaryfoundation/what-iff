<section class="memories-shell">
  <header class="memories-shell__header">
    <div class="memories-shell__copy">
      <h1>Memory Manager</h1>
      <p>Review and correct saved context that informs your conversations.</p>
    </div>
  </header>

  <div class="memories-shell__tabs" role="tablist" aria-label="Memory manager sections">
    <button
      type="button"
      role="tab"
      class="memories-shell__tab"
      [class.memories-shell__tab--active]="activeTab() === 'memories'"
      [attr.aria-selected]="activeTab() === 'memories'"
      (click)="setActiveTab('memories')">
      Memories
    </button>
    <button
      type="button"
      role="tab"
      class="memories-shell__tab"
      [class.memories-shell__tab--active]="activeTab() === 'merge-history'"
      [attr.aria-selected]="activeTab() === 'merge-history'"
      (click)="setActiveTab('merge-history')">
      Merge history
    </button>
    <button
      type="button"
      role="tab"
      class="memories-shell__tab"
      [class.memories-shell__tab--active]="activeTab() === 'compaction-log'"
      [attr.aria-selected]="activeTab() === 'compaction-log'"
      (click)="setActiveTab('compaction-log')">
      Compaction log
    </button>
  </div>

  @if (activeTab() === 'memories') {
    <app-memories-list-tab />
  }
  @if (activeTab() === 'merge-history') {
    <app-memory-merge-history-page [embedded]="true" />
  }
  @if (activeTab() === 'compaction-log') {
    <app-compaction-log-page [embedded]="true" />
  }
</section>
