<ui-modal [open]="open()" labelledBy="set-sensitivity-title" size="sm" (dismiss)="cancel.emit()">
  <h3 id="set-sensitivity-title" modal-header class="text-base font-semibold text-text-primary">
    Set sensitivity for {{ count() }} {{ count() === 1 ? "memory" : "memories" }}
  </h3>
  <fieldset class="grid gap-2 border-0 p-0" [disabled]="saving()">
    <legend class="sr-only">Sensitivity</legend>
    @for (option of options; track option.value) {
      <label class="flex cursor-pointer items-start gap-2 rounded-lg border border-border-base px-3 py-2 text-sm text-text-primary">
        <input
          type="radio"
          class="mt-1"
          name="bulk-sensitivity"
          [value]="option.value"
          [checked]="level() === option.value"
          (change)="level.set(option.value)"
        />
        <span>
          <span class="font-semibold">{{ option.label }}</span>
          <span class="block text-xs text-text-secondary">{{ option.description }}</span>
        </span>
      </label>
    }
  </fieldset>
  <p class="mt-3 text-xs text-text-muted">
    This replaces the current level on every selected memory. Threads limited to a lower level stop seeing them if you raise it.
  </p>
  <div modal-footer class="flex justify-end gap-2">
    <button
      type="button"
      class="rounded-lg border border-border-base px-3 py-2 text-sm text-text-secondary"
      [disabled]="saving()"
      (click)="cancel.emit()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="rounded-lg bg-accent px-3 py-2 text-sm font-semibold text-white disabled:opacity-60"
      [disabled]="saving()"
      (click)="confirm.emit(level())"
    >
      {{ saving() ? "Saving…" : "Set to " + labelFor(level()) }}
    </button>
  </div>
</ui-modal>
