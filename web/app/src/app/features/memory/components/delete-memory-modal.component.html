<ui-modal [open]="open()" labelledBy="delete-memory-title" size="sm" (dismiss)="cancel.emit()">
  <h3 id="delete-memory-title" modal-header class="text-base font-semibold text-text-primary">
    Delete {{ count() }} {{ count() === 1 ? 'memory' : 'memories' }}?
  </h3>
  <p class="text-sm text-text-secondary">
    This action cannot be undone.
  </p>
  <div modal-footer class="flex justify-end gap-2">
    <button
      type="button"
      class="rounded-lg border border-border-base px-3 py-2 text-sm text-text-secondary"
      [disabled]="deleting()"
      (click)="cancel.emit()">
      Cancel
    </button>
    <button
      type="button"
      class="rounded-lg bg-danger px-3 py-2 text-sm font-semibold text-white disabled:opacity-60"
      [disabled]="deleting()"
      (click)="confirm.emit()">
      {{ deleting() ? 'Deleting…' : 'Delete' }}
    </button>
  </div>
</ui-modal>
