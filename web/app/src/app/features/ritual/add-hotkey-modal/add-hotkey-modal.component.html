<div class="fixed inset-0 bg-gray-900/50 z-50 flex items-center justify-center p-4" (click)="onClose()" role="dialog" aria-modal="true" aria-labelledby="add-hotkey-title">
  <div class="relative w-full max-w-md max-h-[calc(90vh-2rem)] bg-white dark:bg-gray-800 rounded-lg shadow-xl flex flex-col overflow-hidden" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-700">
      <h3 id="add-hotkey-title" class="text-lg font-medium text-gray-900 dark:text-white">Add Keyboard Shortcut</h3>
      <button (click)="onClose()" class="text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 focus:outline-none">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <div class="flex-1 min-h-0 p-6 overflow-auto">
      <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">
        Assign a keyboard shortcut to the system skill. Press the desired keys when the input is focused.
      </p>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Hotkey</label>
        <app-hotkey-input
          [ngModel]="bindingValue"
          (ngModelChange)="onValueChange($event)"
          placeholder="Click to set keyboard shortcut">
        </app-hotkey-input>
      </div>

      @if (bindingError) {
        <div class="mb-4 text-sm text-red-600 dark:text-red-400">{{ bindingError }}</div>
      }
    </div>

    <div class="flex items-center justify-end p-4 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 space-x-3">
      <button (click)="onClose()" type="button" class="px-4 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-md text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none">
        Cancel
      </button>
      <button (click)="onSave()" [disabled]="isSaving" type="button" class="px-4 py-2 bg-indigo-600 dark:bg-indigo-500 border border-transparent rounded-md text-sm font-medium text-white hover:bg-indigo-700 dark:hover:bg-indigo-600 focus:outline-none">
        @if (isSaving) {
          Saving...
        } @else {
          Save
        }
      </button>
    </div>
  </div>
</div>
