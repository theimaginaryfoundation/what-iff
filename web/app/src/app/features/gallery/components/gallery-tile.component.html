<article
  class="tile group"
  role="listitem"
  draggable="true"
  [class.tile--selected]="selected()"
  [class.tile--file]="tile().isFile"
  (dragstart)="onDragStart($event)"
  (dragend)="dragEnd.emit()">
  @if (selectable()) {
    <button
      type="button"
      class="tile__check"
      role="checkbox"
      [attr.aria-checked]="selected()"
      [attr.aria-label]="'Select ' + noun() + ' ' + tile().name"
      (click)="$event.stopPropagation(); toggleSelect.emit(tile().id)">
      <span class="tile__check-mark"></span>
    </button>
  } @else {
    <button
      type="button"
      class="tile__delete"
      [attr.aria-label]="'Delete ' + noun() + ' ' + tile().name"
      [uiTooltip]="'Delete this ' + noun()"
      (click)="$event.stopPropagation(); delete.emit(tile().id)">
      ×
    </button>
  }

  @if (tile().isFile) {
    <button
      type="button"
      class="tile__button tile__file"
      [attr.aria-label]="'Open file ' + tile().name + (tile().personalityName ? ' for ' + tile().personalityName : '')"
      [uiTooltip]="tile().name"
      truncatedOnly
      [truncationTarget]="fileName"
      placement="bottom"
      (click)="selectable() ? toggleSelect.emit(tile().id) : open.emit(tile().id)">
      <span class="tile__file-sheet" aria-hidden="true">
        <span class="tile__file-badge">{{ tile().badge }}</span>
      </span>
      <span #fileName class="tile__file-name">{{ tile().name }}</span>
      @if (tile().personalityName) {
        <span class="tile__file-meta">{{ tile().personalityName }}</span>
      }
    </button>
  } @else if (tile().thumbnailUrl | authImage | async; as src) {
    <button
      type="button"
      class="tile__button"
      [attr.aria-label]="'Open image ' + tile().name + (tile().personalityName ? ' for ' + tile().personalityName : '')"
      [uiTooltip]="tile().name"
      truncatedOnly
      [truncationTarget]="overlayTitle"
      placement="bottom"
      (click)="selectable() ? toggleSelect.emit(tile().id) : open.emit(tile().id)">
      <img [src]="src" [alt]="tile().name" class="tile__image" loading="lazy" draggable="false" />
    </button>
  } @else {
    <button
      type="button"
      class="tile__button tile__button--empty"
      (click)="selectable() ? toggleSelect.emit(tile().id) : open.emit(tile().id)">
      Preview unavailable
    </button>
  }

  <div class="tile__overlay">
    <p #overlayTitle class="tile__overlay-title">{{ tile().name }}</p>
  </div>
  @if (showFolder() && tile().folder) {
    <span class="tile__folder" [attr.title]="'In folder ' + tile().folder">{{ tile().folder }}</span>
  }
</article>
