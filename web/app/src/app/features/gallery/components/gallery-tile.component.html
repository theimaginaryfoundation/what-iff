<article class="tile group" role="listitem" [class.tile--selected]="selected()">
  @if (selectable()) {
    <button
      type="button"
      class="tile__check"
      role="checkbox"
      [attr.aria-checked]="selected()"
      [attr.aria-label]="'Select image ' + tile().name"
      (click)="$event.stopPropagation(); toggleSelect.emit(tile().id)">
      <span class="tile__check-mark"></span>
    </button>
  } @else {
    <button
      type="button"
      class="tile__delete"
      [attr.aria-label]="'Delete image ' + tile().name"
      uiTooltip="Delete this image"
      (click)="$event.stopPropagation(); delete.emit(tile().id)">
      ×
    </button>
  }

  @if (tile().thumbnailUrl | authImage | async; as src) {
    <button
      type="button"
      class="tile__button"
      [attr.aria-label]="'Open image ' + tile().name + (tile().personalityName ? ' for ' + tile().personalityName : '')"
      [uiTooltip]="tile().name"
      truncatedOnly
      [truncationTarget]="overlayTitle"
      placement="bottom"
      (click)="selectable() ? toggleSelect.emit(tile().id) : open.emit(tile().id)">
      <img [src]="src" [alt]="tile().name" class="tile__image" loading="lazy" />
    </button>
  } @else {
    <button
      type="button"
      class="tile__button tile__button--empty"
      (click)="selectable() ? toggleSelect.emit(tile().id) : open.emit(tile().id)">
      Preview unavailable
    </button>
  }

  <div class="tile__overlay">
    <p #overlayTitle class="tile__overlay-title">{{ tile().name }}</p>
  </div>
  @if (showFolder() && tile().folder) {
    <span class="tile__folder" [attr.title]="'In folder ' + tile().folder">{{ tile().folder }}</span>
  }
</article>
