<div class="pdf-viewer__toolbar">
  <span class="pdf-viewer__pages" aria-live="polite">
    @if (state() === 'ready') {
      Page {{ currentPage() }} of {{ pageCount() }}
    }
  </span>
  <div class="pdf-viewer__zoom" role="group" aria-label="Zoom">
    <button type="button" aria-label="Zoom out" (click)="zoomOut()" [disabled]="state() !== 'ready'">−</button>
    <button type="button" aria-label="Fit to width" (click)="fitWidth()" [disabled]="state() !== 'ready'">{{ (zoom() * 100).toFixed(0) }}%</button>
    <button type="button" aria-label="Zoom in" (click)="zoomIn()" [disabled]="state() !== 'ready'">+</button>
  </div>
</div>
<div #scroller class="pdf-viewer__scroller" (scroll)="onScroll()">
  @if (state() === 'loading') {
    <p class="pdf-viewer__placeholder" role="status">Opening {{ file().name }}…</p>
  } @else if (state() === 'error') {
    <p class="pdf-viewer__placeholder" role="alert">Could not open this PDF. Download it to view it elsewhere.</p>
  }
  <div #pages class="pdf-viewer__pages-host" [hidden]="state() !== 'ready'"></div>
</div>
