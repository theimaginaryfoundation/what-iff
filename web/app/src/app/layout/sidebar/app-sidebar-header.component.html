<header class="app-sidebar-header" [class.app-sidebar-header--collapsed]="collapsed()">
  <img
    class="app-sidebar-header__logo"
    src="/dark-favicon.ico"
    alt="WhatIff"
  />
  @if (!collapsed()) {
    <span class="app-sidebar-header__brand" aria-label="WhatIff">WhatIff</span>
  }
  <div class="app-sidebar-header__actions">
    <button
      type="button"
      class="app-sidebar-header__help-trigger"
      aria-label="Help and feedback"
      uiTooltip="Help & feedback"
      placement="right"
      (click)="openHelp()"
    >
      <ui-circle-help-icon [size]="15" />
    </button>
    <app-nav-actions-outlet [collapsed]="collapsed()" />
    <button
      type="button"
      class="app-sidebar-header__collapse-toggle"
      [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.aria-expanded]="!collapsed()"
      [uiTooltip]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      placement="right"
      (click)="toggleCollapsed()"
    >
      <ui-panel-left-icon [size]="15" />
    </button>
  </div>
</header>
