server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html names the content-hashed bundles, so a cached copy pins the browser to a previous
  # deploy's JavaScript. Without an explicit directive nginx sends none and browsers fall back to
  # heuristic caching, which silently serves stale app code after a rebuild.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Same staleness hazard as index.html: a stable name whose content changes every
  # deploy. Exact match (no try_files) so a build missing this file 404s honestly
  # instead of falling through to index.html with a 200.
  location = /version.json {
    add_header Cache-Control "no-cache";
  }

  # Build output is content-hashed: a changed file always ships under a new name.
  location ~* \.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Static files copied verbatim by the build; these keep stable names, so they must revalidate
  # eventually rather than being treated as immutable. ^~ keeps them out of the regex block above.
  location ^~ /assets/ {
    expires 30d;
    add_header Cache-Control "public";
  }
}
